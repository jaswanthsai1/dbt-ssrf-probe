version: 2
semantic_models:
  - name: probe_sem
    model: ref('probe')
    entities:
      - name: probe
        type: primary
    dimensions:
      - name: date_day
        type: time
        type_params:
          granularity: day
    measures:
      - name: my_measure
        agg: sum
        expr: id
        agg_time_dimension: date_day
metrics:
  - name: pwn_metric
    label: pwn
    type: simple
    type_params:
      measure: my_measure
    filter: "{{ 7*7 }}"
